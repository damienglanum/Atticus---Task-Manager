name: Publish automatic update

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atticus-update-main
  cancel-in-progress: true

jobs:
  prepare:
    if: github.ref_name == 'main'
    runs-on: ubuntu-22.04
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # Main is a moving release tag with a stable latest.json URL. Remove the
      # previous release once, before either platform starts uploading.
      - name: Remove the previous main release
        run: |
          if gh release view main --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete main --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          fi

  publish:
    needs: prepare
    strategy:
      fail-fast: false
      # tauri-action merges each platform into latest.json. Serial uploads keep
      # that read-modify-write deterministic instead of racing the same asset.
      max-parallel: 1
      matrix:
        include:
          - name: macOS Apple Silicon
            platform: macos-15
            rust_target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles app,dmg
          - name: Linux x86_64
            platform: ubuntu-22.04
            rust_target: ""
            args: --bundles appimage,deb

    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Use the lockfile npm version
        run: npm install --global npm@10.9.4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Require the updater signing key
        run: test -n "$TAURI_SIGNING_PRIVATE_KEY"

      - name: Install dependencies
        run: npm ci

      - name: Set the automatic build version
        run: node scripts/set-ci-version.mjs "0.1.${{ github.run_number }}"

      - name: Build, sign, and upload ${{ matrix.name }}
        uses: tauri-apps/tauri-action@v1
        with:
          tagName: main
          releaseName: Atticus main build ${{ github.run_number }}
          releaseBody: Automatic macOS and Linux build from `main` at `${{ github.sha }}`.
          # Keep downloads hidden until every platform and latest.json entry is
          # present. The finalize job publishes the complete release.
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          args: ${{ matrix.args }}

  finalize:
    needs: publish
    runs-on: ubuntu-22.04
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Publish the complete release
        run: gh release edit main --repo "$GITHUB_REPOSITORY" --draft=false
