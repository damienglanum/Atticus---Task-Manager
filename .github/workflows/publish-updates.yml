name: Publish automatic update

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atticus-update-main
  cancel-in-progress: true

jobs:
  publish:
    if: github.ref_name == 'main'
    # The app currently targets the Apple Silicon Mac used for development.
    runs-on: macos-15
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Require the updater signing key
        run: test -n "$TAURI_SIGNING_PRIVATE_KEY"

      - name: Install dependencies
        run: npm ci

      - name: Set the automatic build version
        run: node scripts/set-ci-version.mjs "0.1.${{ github.run_number }}"

      # Main is a moving release tag with a stable latest.json URL. The
      # old release must go before Tauri Action can upload assets with the same
      # filenames. A check that lands during this short window simply retries at
      # the app's next scheduled check.
      - name: Remove the previous channel release
        continue-on-error: true
        run: gh release delete main --cleanup-tag --yes

      - name: Build, sign, and publish the channel
        uses: tauri-apps/tauri-action@v1
        with:
          tagName: main
          releaseName: Atticus main build ${{ github.run_number }}
          releaseBody: Automatic build from `main` at `${{ github.sha }}`.
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          # `dmg` is the first-install download; `app` is the updater-enabled
          # target that also produces the signed .app.tar.gz and latest.json.
          args: --target aarch64-apple-darwin --bundles app,dmg
